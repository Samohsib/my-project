<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="코딩 퍼즐">
<meta name="description" content="명령 블록을 쌓아 로봇 반짝이를 움직이는 코딩 퍼즐">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="css/app.css">
<title>반짝이 코딩 퍼즐</title>
</head>
<body data-screen="home">

<!-- 첫 화면: 판 고르기 -->
<section id="home" class="screen on">
  <header class="home-head">
    <div id="homeRobot" class="home-robot"></div>
    <div class="home-title">
      <h1>반짝이 코딩 퍼즐</h1>
      <p>명령 블록을 쌓아서 로봇 반짝이를 움직여요!</p>
    </div>
    <div id="totalStars" class="total-stars" aria-label="모은 별"></div>
    <button id="settingsBtn" class="round-btn" type="button" aria-label="설정">⚙️</button>
  </header>
  <button id="continueBtn" class="continue" type="button" hidden></button>
  <div id="chapters" class="chapters"></div>
</section>

<!-- 판 화면 -->
<section id="play" class="screen">
  <header class="topbar">
    <button id="backBtn" class="tb-btn" type="button" aria-label="판 목록으로">◀ <span>판 목록</span></button>
    <div class="lv-title"><span id="lvId" class="lv-id"></span><b id="lvName"></b></div>
    <button id="hintBtn" class="tb-btn" type="button">💡 <span>힌트</span></button>
    <button id="voiceBtn" class="tb-btn icon" type="button" aria-label="음성 안내 끄기">🔊</button>
    <button id="settingsBtn2" class="tb-btn icon" type="button" aria-label="설정">⚙️</button>
  </header>
  <main class="playgrid">
    <section class="stage">
      <div class="goal"><span class="goal-label">목표</span><span id="goalText"></span><span id="goalCount" class="goal-count"></span></div>
      <div class="board-wrap">
        <div id="board" class="board"></div>
        <div id="fx" class="confetti" aria-hidden="true"></div>
      </div>
      <div id="bubble" class="bubble" role="status" aria-live="polite"></div>
      <div class="runbar">
        <button id="runBtn" class="big run" type="button"><span class="ic">▶</span><span>실행</span></button>
        <button id="stepBtn" class="big step" type="button"><span class="ic">👣</span><span>한 단계</span></button>
        <button id="resetBtn" class="big reset" type="button"><span class="ic">⏮</span><span>처음부터</span></button>
      </div>
    </section>
    <section class="editor">
      <div id="palette" class="palette"></div>
      <div class="ws-wrap">
        <div class="ws-tools">
          <span id="count" class="count">블록 0개</span>
          <span id="target" class="target"></span>
          <span class="sp"></span>
          <button id="undoBtn" class="tool" type="button"><span>↶</span><span>되돌리기</span></button>
          <button id="clearBtn" class="tool" type="button"><span>🗑</span><span>다 지우기</span></button>
        </div>
        <div id="workspace" class="workspace"></div>
      </div>
    </section>
  </main>
</section>

<div id="modal" class="modal"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
